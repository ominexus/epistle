<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갈라디아서 일주일 묵상 가이드</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    scale: {
                        '102': '1.02',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons Components ---
        const Icon = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const ChevronDown = ({ className }) => <Icon className={className}><path d="m6 9 6 6 6-6"/></Icon>;
        const ChevronUp = ({ className }) => <Icon className={className}><path d="m18 15-6-6-6 6"/></Icon>;
        const ChevronLeft = ({ className }) => <Icon className={className}><path d="m15 18-6-6 6-6"/></Icon>;
        const Sun = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41-1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
        const Moon = ({ className }) => <Icon className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Icon>;
        const BookOpen = ({ className }) => <Icon className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>;
        const MessageCircle = ({ className }) => <Icon className={className}><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></Icon>;
        const Heart = ({ className }) => <Icon className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Icon>;

        // --- Data ---
        const devotionalData = [
            {
                day: "1일차",
                emoji: "🌿",
                title: "제3의 길, 복음의 유일성",
                scripture: "갈라디아서 1:6-10",
                message: [
                    "세상은 우리에게 두 가지 길만 제시합니다. \"규칙을 지켜서 구원받으라(종교)\"거나 \"네 마음대로 살라(비종교)\"는 것입니다. 하지만 바울은 이 둘을 모두 거부합니다.",
                    "**'다른 복음'**의 공식은 항상 **\"예수 + (무언가) = 구원\"**입니다. 그 '무언가'가 돈이든, 성공이든, 도덕적 우월감이든, 그것이 없으면 내 인생이 무너진다고 믿는다면 그것은 가짜 복음입니다.",
                    "참된 복음은 더하는 것이 아닙니다. 예수님 한 분만으로 충분하다는 선언입니다."
                ],
                questions: [
                    "나에게 \"예수님 플러스 알파(+α)\"는 무엇인가요? (예: 예수님도 믿지만, 돈/인정/성공도 있어야 내 인생이 가치 있다고 느끼는가?)",
                    "그것이 사라졌을 때 나는 여전히 안전하다고 느낄 수 있나요?"
                ],
                prayer: "주님, 예수님 외에 제가 덧붙이려 했던 모든 '조건'들을 내려놓습니다. 오직 그리스도만으로 충분함을 믿게 하소서."
            },
            {
                day: "2일차",
                emoji: "🎭",
                title: "두려움에서 감사로 (동기의 변화)",
                scripture: "갈라디아서 2:11-16",
                message: [
                    "베드로는 이방인과 식사하다가 유대인들이 오자 자리를 피했습니다. 이는 단순한 실수가 아니라 복음의 진리를 훼손하는 위선이었습니다. 그는 하나님의 사랑보다 사람들의 시선을 더 두려워했습니다.",
                    "종교는 \"순종하면 사랑받는다\"고 말하며 두려움을 동기로 삼습니다. 반면 복음은 \"사랑받았으니 순종한다\"고 말하며 감사를 동기로 삼습니다.",
                    "당신이 착하게 살려는 이유는 벌받기 싫어서인가요, 아니면 받은 사랑이 너무 커서인가요?"
                ],
                questions: [
                    "나는 최근 하나님께 혼날까 봐, 혹은 복을 받기 위해 억지로 순종한 적이 있나요?",
                    "사람들의 평가가 두려워 그리스도인으로서의 정체성을 숨기거나 행동을 바꾼 적은 언제인가요?"
                ],
                prayer: "두려움 때문에 가면을 쓰지 않게 하소서. 이미 저를 의롭다 하신 주님의 판결을 믿고 당당하게 살게 하소서."
            },
            {
                day: "3일차",
                emoji: "🆔",
                title: "성취가 아닌 신분 (정체성)",
                scripture: "갈라디아서 3:1-5, 26-27",
                message: [
                    "현대 사회는 **\"너의 성취(Performance)가 곧 너의 정체성\"**이라고 가르칩니다. 그래서 우리는 성공하면 교만해지고, 실패하면 절망합니다. 하지만 갈라디아서는 우리의 정체성이 **행위가 아니라 신분(Status)**에 있다고 말합니다.",
                    "우리는 '그리스도로 옷 입은' 자들입니다. 경기 시작 전에 이미 금메달을 목에 건 선수와 같습니다. 노예는 인정받기 위해 일하지만, 자녀는 이미 사랑받고 있기에 기쁨으로 일합니다. 당신은 노예입니까, 자녀입니까?"
                ],
                questions: [
                    "최근 나를 가장 우울하게 하거나 불안하게 한 실패는 무엇인가요? 그것이 나의 '자녀 됨'을 취소할 수 있나요?",
                    "나는 오늘 하루, 무언가를 증명하기 위해 살았나요, 아니면 사랑받는 자녀로서 살았나요?"
                ],
                prayer: "나의 성적표가 아니라, 예수님이 주신 신분증을 붙들게 하소서. 성공과 실패에 휘둘리지 않는 자녀의 자유를 누리게 하소서."
            },
            {
                day: "4일차",
                emoji: "🗿",
                title: "마음의 우상 탐지하기",
                scripture: "갈라디아서 4:8-9",
                message: [
                    "우상은 나쁜 것이 아닙니다. **\"하나님보다 더 중요해진 좋은 것(Good things)\"**이 곧 우상입니다. 가족, 커리어, 로맨스 등 좋은 것들이 '궁극적인 것'이 될 때, 우리는 그것의 노예가 됩니다.",
                    "우리가 돈을 사랑하는 이유는 그 이면에 **'통제(내 삶의 안전)'**나 **'인정(사람들의 존경)'**을 갈망하기 때문입니다(근원적 우상). 복음은 예수님이 십자가에서 나를 위해 찢기심으로 나의 안전과 인정이 되셨음을 보여주며 우상의 사슬을 끊습니다."
                ],
                questions: [
                    "만약 내일 당장 잃어버린다면 살 소망이 끊어질 것 같은 한 가지는 무엇인가요? (그것이 당신의 주인일 수 있습니다.)",
                    "그 대상이 약속하는 것(안전, 행복)을 예수님이 어떻게 더 완전하게 채워주시는지 묵상해 보세요."
                ],
                prayer: "좋은 것들을 하나님 자리에 올려놓았던 죄를 회개합니다. 헛된 주인들에게 종 노릇 하기를 멈추고 참된 주인이신 주님께 돌아갑니다."
            },
            {
                day: "5일차",
                emoji: "🍎",
                title: "성령의 열매 vs 가짜 열매",
                scripture: "갈라디아서 5:16-24",
                message: [
                    "참된 자유는 '내 마음대로 하는 것'이 아니라, '죄를 짓지 않을 수 있는 능력'입니다. 성령의 열매는 9가지가 아니라 하나(단수)로, 우리 인격의 전반적인 변화를 의미합니다.",
                    "기질적으로 착한 것과 성령의 열매는 다릅니다. 가짜 사랑은 나를 기분 좋게 하는 사람에게만 잘해주는 '이기적 애착'입니다. 가짜 화평은 문제를 회피하는 '무관심'입니다.",
                    "성령의 열매는 내 힘이 아닌, 십자가의 은혜가 마음에 스며들 때 맺히는 그리스도의 성품입니다."
                ],
                questions: [
                    "'성령의 열매' 표(보고서 5장 참고)에서 내가 가장 부족하거나, 혹은 가짜로 꾸며내고 있었던 열매는 무엇인가요?",
                    "나의 의지력으로 죄를 억누르려 하기보다, 성령님의 도우심을 구해야 할 영역은 어디인가요?"
                ],
                prayer: "억지로 흉내 내는 삶이 아니라, 성령님과 동행하며 저절로 맺혀지는 인격의 열매를 허락하소서."
            },
            {
                day: "6일차",
                emoji: "🤝",
                title: "서로 짐을 지라 (공동체)",
                scripture: "갈라디아서 6:1-5",
                message: [
                    "복음은 개인주의를 치료합니다. 율법주의자는 타인을 보며 우월감(\"나는 쟤보다 나아\")에 빠져 정죄하거나, 열등감(\"나는 왜 이럴까\")에 빠져 시기합니다.",
                    "하지만 복음을 아는 자는 \"나도 죄인이지만 은혜로 구원받았다\"는 사실을 알기에, 타인의 짐을 함께 질 수 있습니다. 경쟁자가 아닌 형제로, 심판자가 아닌 동료로 서로를 바라봅니다."
                ],
                questions: [
                    "나는 교회나 공동체에서 누군가를 은근히 무시하거나, 반대로 질투하고 있지 않나요?",
                    "이번 주에 내가 구체적으로 짐을 나눠 져야 할 지체는 누구인가요?"
                ],
                prayer: "비교와 경쟁의 마음을 버리고, 서로의 연약함을 감싸주는 복음의 공동체를 이루게 하소서."
            },
            {
                day: "7일차",
                emoji: "✝️",
                title: "십자가만이 나의 자랑",
                scripture: "갈라디아서 6:14-17",
                message: [
                    "\"내게는 우리 주 예수 그리스도의 십자가 외에 결코 자랑할 것이 없으니.\"",
                    "세상은 스펙, 재산, 인맥을 자랑거리로 삼습니다. 그것이 나의 가치를 증명한다고 믿기 때문입니다. 하지만 그리스도인은 압니다. 내가 이룬 모든 것은 결국 사라지지만, 예수님이 십자가에서 이루신 일만이 영원하다는 것을요.",
                    "십자가는 내가 얼마나 큰 죄인인지(겸손)와 동시에 얼마나 큰 사랑을 받았는지(확신)를 보여주는 유일한 증거입니다."
                ],
                questions: [
                    "나를 소개할 때 주로 내세우는 '타이틀'이나 '자랑거리'는 무엇인가요?",
                    "그것들이 다 사라져도 '십자가' 하나만으로 충분히 기뻐할 수 있나요?"
                ],
                prayer: "세상의 헛된 자랑을 배설물로 여기게 하소서. 십자가만이 나의 유일한 자랑이요, 나의 전부임을 고백합니다. 아멘."
            }
        ];

        // --- Components ---
        const AccordionItem = ({ day, isOpen, onClick, isDarkMode }) => {
            return (
                <div className={`mb-4 border rounded-xl overflow-hidden transition-all duration-300 ${isDarkMode ? 'border-gray-700 bg-gray-800 shadow-lg' : 'border-gray-200 bg-white shadow-md'}`}>
                    <button
                        onClick={onClick}
                        className={`w-full px-5 py-4 text-left flex justify-between items-center transition-colors ${
                            isOpen 
                                ? (isDarkMode ? 'bg-gray-700' : 'bg-orange-50') 
                                : (isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50')
                        }`}
                    >
                        <div className="flex items-center space-x-3">
                            <span className="text-2xl">{day.emoji}</span>
                            <div>
                                <div className={`text-xs font-semibold uppercase tracking-wider mb-0.5 ${isDarkMode ? 'text-orange-400' : 'text-orange-600'}`}>
                                    {day.day}
                                </div>
                                <h3 className={`font-bold text-lg leading-tight ${isDarkMode ? 'text-gray-100' : 'text-gray-800'}`}>
                                    {day.title}
                                </h3>
                            </div>
                        </div>
                        {isOpen ? <ChevronUp className="w-5 h-5 text-gray-500" /> : <ChevronDown className="w-5 h-5 text-gray-500" />}
                    </button>
                    
                    {isOpen && (
                        <div className={`p-5 animate-fade-in ${isDarkMode ? 'text-gray-300' : 'text-gray-700'}`}>
                            {/* Scripture */}
                            <div className={`flex items-center mb-4 text-sm font-medium ${isDarkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                                <BookOpen className="w-4 h-4 mr-2" />
                                {day.scripture}
                            </div>

                            {/* Core Message */}
                            <div className="mb-6 space-y-3">
                                {day.message.map((para, idx) => {
                                    // Simple bold parsing
                                    const parts = para.split(/(\*\*.*?\*\*)/g);
                                    return (
                                        <p key={idx} className="leading-relaxed">
                                            {parts.map((part, i) => 
                                                part.startsWith('**') && part.endsWith('**') 
                                                    ? <strong key={i} className={isDarkMode ? 'text-white' : 'text-gray-900'}>{part.slice(2, -2)}</strong>
                                                    : part
                                            )}
                                        </p>
                                    );
                                })}
                            </div>

                            {/* Reflection Questions */}
                            <div className={`mb-6 p-4 rounded-lg ${isDarkMode ? 'bg-gray-700/50' : 'bg-orange-50'}`}>
                                <h4 className={`flex items-center font-bold mb-3 ${isDarkMode ? 'text-orange-300' : 'text-orange-800'}`}>
                                    <MessageCircle className="w-4 h-4 mr-2" /> 묵상 질문
                                </h4>
                                <ul className="space-y-3">
                                    {day.questions.map((q, idx) => (
                                        <li key={idx} className="flex items-start">
                                            <span className={`mr-2 mt-1.5 w-1.5 h-1.5 rounded-full flex-shrink-0 ${isDarkMode ? 'bg-orange-400' : 'bg-orange-600'}`}></span>
                                            <span className="text-sm md:text-base">{q}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {/* Prayer */}
                            <div className={`p-4 rounded-lg border border-l-4 ${isDarkMode ? 'bg-gray-900 border-gray-700 border-l-orange-500' : 'bg-white border-gray-100 border-l-orange-500'}`}>
                                <h4 className={`flex items-center font-bold mb-2 ${isDarkMode ? 'text-gray-200' : 'text-gray-800'}`}>
                                    <Heart className="w-4 h-4 mr-2 text-pink-500" /> 기도
                                </h4>
                                <p className="italic text-sm md:text-base opacity-90">
                                    "{day.prayer}"
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DevotionalApp = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [openDay, setOpenDay] = useState(0); // Default open first day

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);
            const goBack = () => {
                // If integrated, this could link to index.html
                window.location.href = 'index.html';
            };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'} transition-colors duration-200`}>
                    
                    {/* Header */}
                    <div className={`sticky top-0 z-20 px-4 py-3 flex items-center shadow-md ${darkMode ? 'bg-orange-900/90 backdrop-blur-md' : 'bg-orange-600/95 backdrop-blur-md'} text-white`}>
                        <button onClick={goBack} className="mr-3 p-1 hover:bg-white/20 rounded-full transition" aria-label="뒤로 가기">
                            <ChevronLeft className="w-6 h-6" />
                        </button>
                        <h1 className="text-lg font-bold truncate flex-1">갈라디아서 7일 묵상</h1>
                        <button onClick={toggleDarkMode} className="p-2 rounded-full hover:bg-white/20 transition">
                            {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                        </button>
                    </div>

                    {/* Content Container */}
                    <div className="max-w-2xl mx-auto p-4 md:py-8">
                        
                        {/* Intro Card */}
                        <div className="mb-8 text-center animate-fade-in">
                            <h2 className="text-2xl md:text-3xl font-extrabold mb-3 tracking-tight">참된 자유를 찾아서</h2>
                            <p className={`text-sm md:text-base leading-relaxed max-w-lg mx-auto ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>
                                '종교(율법주의)'와 '비종교(방종)'를 넘어선 제3의 길,<br/>
                                <strong className={`${darkMode ? 'text-orange-300' : 'text-orange-700'}`}>'복음'</strong>의 능력을 회복하는 일주일 여정입니다.
                            </p>
                        </div>

                        {/* Days List */}
                        <div className="space-y-3">
                            {devotionalData.map((data, idx) => (
                                <AccordionItem 
                                    key={idx}
                                    day={data}
                                    isOpen={openDay === idx}
                                    onClick={() => setOpenDay(openDay === idx ? -1 : idx)}
                                    isDarkMode={darkMode}
                                />
                            ))}
                        </div>

                        {/* Footer Link */}
                        <div className="mt-10 text-center">
                            <button 
                                onClick={goBack}
                                className={`text-sm font-medium underline underline-offset-4 ${darkMode ? 'text-gray-500 hover:text-gray-300' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                바울 서신 가이드 홈으로 돌아가기
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DevotionalApp />);
    </script>
</body>
</html>
