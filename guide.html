                        },
                        {
                            sub: '관계의 혁명: 성령 충만',
                            text: [
                                '성령 충만의 증거는 신비한 체험만이 아니라 관계의 변화로 나타납니다. 부부, 부모와 자녀, 상전과 종의 관계에서 "그리스도를 경외함으로 피차 복종하는 것"이 성령 충만의 표지입니다.'
                            ]
                        },
                        {
                            sub: '영적 전쟁과 전신 갑주',
                            text: [
                                '우리의 씨름은 혈과 육을 상대하는 것이 아닙니다. 마귀의 간계를 능히 대적하기 위해 하나님의 전신 갑주를 입어야 합니다.',
                                '우리는 승리를 쟁취하기 위해 싸우는 것이 아니라, 그리스도가 이미 거두신 승리 위에 굳건히 서기(Stand) 위해 싸웁니다.'
                            ]
                        }
                        ]
                    }
                    ]
                }
                },
                {
                id: 'philippians',
                title: '빌립보서',
                subtitle: '정복할 수 없는 기쁨',
                color: 'bg-pink-600',
                content: {
                    intro: '감옥에서 쓴 서신으로, 상황을 초월하여 그리스도를 아는 지식에서 나오는 기쁨을 이야기합니다. "기뻐하라"는 명령이 반복되는 기쁨의 서신입니다.',
                    sections: [
                    {
                        title: '1장: 복음의 진보 (Advance)',
                        details: [
                        {
                            sub: '매임이 도리어 진보가 되다',
                            text: [
                                '바울은 감옥에 갇혔으나, 오히려 이것이 로마 시위대(황실 근위대)에게 복음을 전하는 기회가 되었습니다. 복음은 장애물을 뚫고 전진합니다(Prokope).',
                                '"나의 매임이 그리스도 안에서 모든 시위대 안과 그 밖의 모든 사람에게 나타났으니..."'
                            ]
                        },
                        {
                            sub: '사는 것이 그리스도니',
                            text: [
                                '삶의 목적이 돈이나 명예라면 죽음은 모든 것의 상실입니다. 그러나 삶의 목적이 그리스도라면 죽음조차 유익함(Gain)이 됩니다. 더 깊이 그분과 함께하게 되기 때문입니다.'
                            ]
                        }
                        ]
                    },
                    {
                        title: '2장: 그리스도 찬가',
                        details: [
                        {
                            sub: '내려가는 것이 올라가는 길',
                            text: [
                                '너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니... 그는 근본 하나님과 본체시나 자기를 비워 종의 형체를 가지셨습니다.',
                                '그리스도의 길은 하강(Incarnation)을 통한 승리입니다. 자기를 낮추는 자가 하나님에 의해 높임을 받습니다.'
                            ]
                        }
                        ]
                    },
                    {
                        title: '3장: 영적 대차대조표',
                        details: [
                        {
                            sub: '모든 것을 배설물(Skubalon)로 여김',
                            text: [
                                '바울은 당대 최고의 스펙을 가졌으나, 그리스도를 아는 지식이 가장 고상하기에 그 모든 것을 배설물(쓰레기)로 여긴다고 고백합니다.',
                                '이것은 세상 가치를 부정하는 염세주의가 아니라, 비교할 수 없는 더 큰 가치(그리스도)를 발견했을 때 자연스럽게 일어나는 가치 재평가입니다.'
                            ]
                        },
                        {
                            sub: '푯대를 향한 질주',
                            text: [
                                '과거의 실패뿐만 아니라 과거의 영광과 성공도 잊어야 합니다. 뒤에 있는 것은 잊어버리고 앞에 있는 푯대(부활의 영광)를 향해 달려가는 것이 신앙생활입니다.'
                            ]
                        }
                        ]
                    },
                    {
                        title: '4장: 마음을 지키는 평강',
                        details: [
                        {
                            sub: '하나님의 평강이 보초(Sentinel)를 서다',
                            text: [
                                '"아무 것도 염려하지 말고... 그리하면 하나님의 평강이 너희 마음과 생각을 지키시리라."',
                                '여기서 "지키시리라"는 군사 용어로, 보초가 성을 방어하는 것을 의미합니다. 기도로 염려를 맡길 때, 하나님의 평강이 우리 마음 문 앞을 지키는 위병이 되어 불안이 침투하지 못하게 막아줍니다.'
                            ]
                        },
                        {
                            sub: '능력 주시는 자 안에서',
                            text: [
                                '자족은 어떤 형편에서도 그리스도 한 분만으로 만족할 수 있는 영적 적응력입니다. "내게 능력 주시는 자"는 만능 해결사가 아니라, 어떤 상황도 견디고 이기게 하시는 힘의 원천입니다.'
                            ]
                        }
                        ]
                    }
                    ]
                }
                },
                {
                id: 'corinthians',
                title: '고린도전후서',
                subtitle: '은혜로 변화되는 삶과 약함의 신비',
                color: 'bg-purple-600',
                content: {
                    intro: '화려하지만 병든 고린도 교회에게 바울은 "복음이 엉망진창인 삶을 어떻게 재구성하는가"를 설명합니다. 전서는 삶의 문제들에 대한 복음적 해답을, 후서는 사역자의 정체성과 약함의 신비를 다룹니다.',
                    sections: [
                    {
                        title: '고린도전서: 삶을 변화시키는 은혜',
                        details: [
                        {
                            sub: '십자가의 도 vs 세상의 지혜',
                            text: [
                                '고린도 교인들은 화려한 수사학(말빨)과 지혜를 숭상했습니다. 그러나 바울은 십자가의 미련해 보이는 것이 하나님의 능력임을 역설합니다. 세상 지혜는 교만을 낳지만, 십자가는 겸손과 능력을 낳습니다.'
                            ]
                        },
                        {
                            sub: '너희 몸은 성령의 전',
                            text: [
                                '당시 문화는 "몸은 중요하지 않다(영지주의)"거나 "내 몸은 내 마음대로 한다"는 생각이 지배적이었습니다. 그러나 바울은 우리 몸이 값(예수의 피)으로 산 바 된 성전임을 상기시키며, 성적 방종을 경계하고 몸으로 하나님께 영광을 돌리라고 합니다.'
                            ]
                        },
                        {
                            sub: '사랑장 (13장)',
                            text: [
                                '방언, 예언, 믿음이 있어도 사랑이 없으면 울리는 꽹과리와 같습니다. 은사는 사역을 위한 도구일 뿐 성품의 증명이 아닙니다. 가장 큰 길은 사랑입니다.'
                            ]
                        }
                        ]
                    },
                    {
                        title: '고린도후서: 약함의 신학',
                        details: [
                        {
                            sub: '질그릇 안의 보배',
                            text: [
                                '우리는 깨지기 쉽고 볼품없는 질그릇과 같습니다. 그러나 그 안에 우주보다 귀한 보배(예수 그리스도)가 담겨 있습니다.',
                                '능력의 심히 큰 것이 하나님께 있고 우리에게 있지 않음을 알게 하려 함입니다. 나의 약함은 하나님의 능력이 머무는 착륙장입니다.'
                            ]
                        },
                        {
                            sub: '가시: 내 은혜가 네게 족하도다',
                            text: [
                                '바울에게는 육체의 가시(고통)가 있었지만 하나님은 제거해주지 않으셨습니다. 대신 "내 은혜가 네게 족하다"고 하셨습니다. 약할 때 강함 되시는 역설적 은혜가 기독교의 신비입니다.'
                            ]
                        },
                        {
                            sub: '그리스도의 대사 (Ambassadors)',
                            text: [
                                '우리는 그리스도를 대신하여 세상을 향해 "하나님과 화목하라"고 외치는 대사들입니다. 이것이 우리의 새로운 직분이자 정체성입니다.'
                            ]
                        }
                        ]
                    }
                    ]
                }
                }
            ];

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            const AccordionItem = ({ item }) => {
                const [isOpen, setIsOpen] = useState(false);
                
                return (
                <div className={`mb-4 border rounded-lg overflow-hidden ${darkMode ? 'border-gray-700 bg-gray-800' : 'border-gray-200 bg-white'} shadow-sm`}>
                    <button
                    onClick={() => setIsOpen(!isOpen)}
                    className={`w-full px-4 py-3 text-left flex justify-between items-center transition-colors ${
                        isOpen 
                        ? (darkMode ? 'bg-gray-700' : 'bg-gray-50') 
                        : (darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50')
                    }`}
                    >
                    <span className={`font-bold text-lg ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{item.title}</span>
                    {isOpen ? <ChevronUp className="w-5 h-5 text-gray-500" /> : <ChevronDown className="w-5 h-5 text-gray-500" />}
                    </button>
                    
                    {isOpen && (
                    <div className={`p-4 ${darkMode ? 'bg-gray-800 text-gray-300' : 'bg-white text-gray-600'} border-t ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                        <div className="space-y-4">
                        {item.details.map((detail, idx) => (
                            <div key={idx} className="pb-2">
                            <h4 className={`font-semibold mb-2 text-lg ${darkMode ? 'text-blue-400' : 'text-blue-800'}`}>{detail.sub}</h4>
                            {Array.isArray(detail.text) ? (
                                detail.text.map((paragraph, i) => (
                                    <p key={i} className="leading-relaxed text-base mb-2 text-gray-700 dark:text-gray-300 opacity-90">
                                        {paragraph}
                                    </p>
                                ))
                            ) : (
                                <p className="leading-relaxed text-base text-gray-700 dark:text-gray-300">{detail.text}</p>
                            )}
                            </div>
                        ))}
                        </div>
                    </div>
                    )}
                </div>
                );
            };

            const BookDetail = ({ book, onBack }) => (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'} pb-10`}>
                {/* Header */}
                <div className={`sticky top-0 z-10 px-4 py-3 flex items-center shadow-md ${book.color} text-white`}>
                    <button onClick={onBack} className="mr-3 p-1 hover:bg-white/20 rounded-full transition">
                    <ChevronLeft className="w-6 h-6" />
                    </button>
                    <h1 className="text-xl font-bold truncate">{book.title}</h1>
                    <div className="ml-auto">
                        <button onClick={toggleDarkMode} className="p-2 rounded-full hover:bg-white/20">
                            {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                        </button>
                    </div>
                </div>

                {/* Content */}
                <div className="max-w-2xl mx-auto p-4 animate-fade-in">
                    <div className="mb-6 p-4 rounded-lg bg-opacity-10 bg-gray-500 border border-gray-200 dark:border-gray-700">
                        <h2 className={`text-2xl font-bold mb-2 ${darkMode ? 'text-white' : 'text-gray-900'}`}>{book.subtitle}</h2>
                        <p className={`leading-relaxed ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{book.content.intro}</p>
                    </div>
                    
                    <div className="space-y-2">
                    {book.content.sections.map((section, idx) => (
                        <AccordionItem key={idx} item={section} />
                    ))}
                    </div>

                    <div className="mt-8 text-center pb-8">
                        <button 
                            onClick={onBack}
                            className={`px-6 py-3 rounded-full border shadow-sm ${darkMode ? 'border-gray-600 text-gray-300 hover:bg-gray-800' : 'border-gray-300 text-gray-600 hover:bg-gray-100'} transition font-medium`}
                        >
                            다른 서신 목록으로 돌아가기
                        </button>
                    </div>
                </div>
                </div>
            );

            const HomeView = () => (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'} p-4 flex flex-col items-center justify-center`}>
                <div className="max-w-md w-full">
                    <div className="flex justify-between items-center mb-8 px-2">
                        <div className="text-left">
                            <h1 className="text-3xl font-extrabold mb-1 tracking-tight">바울 서신<br/>심층 가이드</h1>
                            <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>성경의 깊은 진리를 모바일에서 만나보세요</p>
                        </div>
                        <button onClick={toggleDarkMode} className="p-3 rounded-full bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition shadow-sm">
                            {darkMode ? <Sun className="w-6 h-6" /> : <Moon className="w-6 h-6" />}
                        </button>
                    </div>

                    <div className="grid gap-4">
                    {studyData.map((book) => (
                        <button
                        key={book.id}
                        onClick={() => setCurrentBook(book)}
                        className={`${book.color} text-white p-6 rounded-2xl shadow-lg transform transition duration-200 hover:scale-102 active:scale-95 text-left group relative overflow-hidden`}
                        >
                        <div className="relative z-10 flex justify-between items-center">
                            <div>
                            <h2 className="text-2xl font-bold mb-1">{book.title}</h2>
                            <p className="text-white/90 text-sm font-medium opacity-90">{book.subtitle}</p>
                            </div>
                            <div className="bg-white/20 p-2 rounded-full">
                                <ChevronRight className="w-6 h-6 text-white" />
                            </div>
                        </div>
                        {/* Decorative background elements */}
                        <div className="absolute -bottom-6 -right-6 w-32 h-32 bg-white/10 rounded-full blur-2xl group-hover:bg-white/20 transition"></div>
                        <div className="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-white/10 to-transparent"></div>
                        </button>
                    ))}
                    </div>
                    
                    <div className={`mt-12 text-center text-xs ${darkMode ? 'text-gray-600' : 'text-gray-400'}`}>
                    <p>© 2026 Bible Study Guide App</p>
                    <p className="mt-1">모바일 최적화 버전</p>
                    </div>
                </div>
                </div>
            );

            return (
                <div className="font-sans antialiased selection:bg-blue-200 selection:text-blue-900">
                {currentBook ? (
                    <BookDetail book={currentBook} onBack={() => setCurrentBook(null)} />
                ) : (
                    <HomeView />
                )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BibleGuideApp />);
    </script>
</body>
</html>
