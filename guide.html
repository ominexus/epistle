                        {
                            sub: '5. 약할 때 강함이라',
                            text: '나의 가장 약한 부분이 하나님의 능력이 머무는 곳이 됩니다. "내 은혜가 네게 족하다."'
                        }
                        ]
                    }
                    ]
                }
                }
            ];

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            const AccordionItem = ({ item }) => {
                const [isOpen, setIsOpen] = useState(false);
                
                return (
                <div className={`mb-4 border rounded-lg overflow-hidden ${darkMode ? 'border-gray-700 bg-gray-800' : 'border-gray-200 bg-white'} shadow-sm`}>
                    <button
                    onClick={() => setIsOpen(!isOpen)}
                    className={`w-full px-4 py-3 text-left flex justify-between items-center transition-colors ${
                        isOpen 
                        ? (darkMode ? 'bg-gray-700' : 'bg-gray-50') 
                        : (darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50')
                    }`}
                    >
                    <span className={`font-bold text-lg ${darkMode ? 'text-gray-100' : 'text-gray-800'}`}>{item.title}</span>
                    {isOpen ? <ChevronUp className="w-5 h-5 text-gray-500" /> : <ChevronDown className="w-5 h-5 text-gray-500" />}
                    </button>
                    
                    {isOpen && (
                    <div className={`p-4 ${darkMode ? 'bg-gray-800 text-gray-300' : 'bg-white text-gray-600'} border-t ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                        <div className="space-y-4">
                        {item.details.map((detail, idx) => (
                            <div key={idx} className="pb-2">
                            <h4 className={`font-semibold mb-1 ${darkMode ? 'text-blue-400' : 'text-blue-800'}`}>{detail.sub}</h4>
                            <p className="leading-relaxed text-sm md:text-base">{detail.text}</p>
                            </div>
                        ))}
                        </div>
                    </div>
                    )}
                </div>
                );
            };

            const BookDetail = ({ book, onBack }) => (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'} pb-10`}>
                {/* Header */}
                <div className={`sticky top-0 z-10 px-4 py-3 flex items-center shadow-md ${book.color} text-white`}>
                    <button onClick={onBack} className="mr-3 p-1 hover:bg-white/20 rounded-full transition">
                    <ChevronLeft className="w-6 h-6" />
                    </button>
                    <h1 className="text-xl font-bold truncate">{book.title}</h1>
                    <div className="ml-auto">
                        <button onClick={toggleDarkMode} className="p-2 rounded-full hover:bg-white/20">
                            {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                        </button>
                    </div>
                </div>

                {/* Content */}
                <div className="max-w-2xl mx-auto p-4 animate-fade-in">
                    <div className="mb-6">
                    <h2 className={`text-2xl font-bold mb-2 ${darkMode ? 'text-white' : 'text-gray-900'}`}>{book.subtitle}</h2>
                    <p className={`leading-relaxed ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{book.content.intro}</p>
                    </div>
                    
                    <div className="space-y-2">
                    {book.content.sections.map((section, idx) => (
                        <AccordionItem key={idx} item={section} />
                    ))}
                    </div>

                    <div className="mt-8 text-center">
                        <button 
                            onClick={onBack}
                            className={`px-6 py-2 rounded-full border ${darkMode ? 'border-gray-600 text-gray-400 hover:bg-gray-800' : 'border-gray-300 text-gray-500 hover:bg-gray-100'} transition text-sm`}
                        >
                            다른 서신 보기
                        </button>
                    </div>
                </div>
                </div>
            );

            const HomeView = () => (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'} p-4 flex flex-col items-center justify-center`}>
                <div className="max-w-md w-full">
                    <div className="flex justify-between items-center mb-8">
                        <div className="text-center w-full">
                            <h1 className="text-3xl font-extrabold mb-2 tracking-tight">바울 서신<br/>심층 가이드</h1>
                            <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>성경의 깊은 진리를 모바일에서 만나보세요</p>
                        </div>
                        <button onClick={toggleDarkMode} className="absolute top-4 right-4 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                            {darkMode ? <Sun className="w-6 h-6" /> : <Moon className="w-6 h-6" />}
                        </button>
                    </div>

                    <div className="grid gap-4">
                    {studyData.map((book) => (
                        <button
                        key={book.id}
                        onClick={() => setCurrentBook(book)}
                        className={`${book.color} text-white p-5 rounded-xl shadow-lg transform transition hover:scale-102 active:scale-95 text-left group relative overflow-hidden`}
                        >
                        <div className="relative z-10 flex justify-between items-center">
                            <div>
                            <h2 className="text-2xl font-bold mb-1">{book.title}</h2>
                            <p className="text-white/90 text-sm font-medium">{book.subtitle}</p>
                            </div>
                            <ChevronRight className="w-6 h-6 text-white/70 group-hover:text-white transition" />
                        </div>
                        <div className="absolute -bottom-4 -right-4 w-24 h-24 bg-white/10 rounded-full blur-xl"></div>
                        </button>
                    ))}
                    </div>
                    
                    <div className={`mt-12 text-center text-xs ${darkMode ? 'text-gray-600' : 'text-gray-400'}`}>
                    <p>© 2026 Bible Study Guide App</p>
                    </div>
                </div>
                </div>
            );

            return (
                <div className="font-sans antialiased">
                {currentBook ? (
                    <BookDetail book={currentBook} onBack={() => setCurrentBook(null)} />
                ) : (
                    <HomeView />
                )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BibleGuideApp />);
    </script>
</body>
</html>
