<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 바울 서신 유형 찾기</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #4A6FA5;
            --accent: #FF9F43;
            --bg: #F3F4F6;
            --white: #FFFFFF;
            --text: #333333;
            --gray: #666666;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .progress-area { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: #eee; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        h1 { color: var(--primary); font-size: 1.6rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.2rem; margin-bottom: 1.5rem; color: #2c3e50; word-break: keep-all; }
        
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
            margin-top: 10px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-option { background: #F8F9FA; border: 2px solid #E9ECEF; color: #495057; text-align: left; padding-left: 20px; }

        .bible-card { background-color: #FFF8E1; border-left: 4px solid var(--accent); padding: 15px; text-align: left; margin: 20px 0; border-radius: 0 10px 10px 0; }
        .bible-text { font-style: italic; font-weight: 600; color: #555; font-size: 0.95rem; }
        
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #result-capture-area.for-capture {
            background: #ffffff !important;
            padding: 40px !important;
            width: 450px !important;
            border-radius: 0 !important;
        }
    </style>
</head>
<body>
    <div class="card">
        <section id="screen-start" class="fade-in">
            <div style="font-size: 4rem; margin-bottom: 20px;">🏛️</div>
            <h1>바울의 편지 찾기</h1>
            <p class="sub">수많은 교회에 편지를 썼던 바울,<br>지금 나에게 편지를 보낸다면?</p>
            <button class="btn btn-primary" onclick="startTest()">내 유형 알아보기</button>
            <div style="margin-top:20px; font-size:0.7rem; color:#ccc;">LOGOS CHURCH HIGH SCHOOL</div>
        </section>

        <section id="screen-quiz" class="hidden">
            <div class="progress-area"><div class="progress-bar" id="bar"></div></div>
            <div style="margin-bottom: 20px; color: var(--primary); font-weight:bold;">Q<span id="q-num">1</span>/15</div>
            <h2 id="q-text">질문 내용</h2>
            <div id="btn-area"></div>
        </section>

        <section id="screen-tiebreaker" class="hidden fade-in">
            <div style="font-size: 3rem; margin-bottom: 15px;">⚖️</div>
            <h2>가장 마음이 가는 문장은?</h2>
            <div id="tie-options"></div>
        </section>

        <section id="screen-result" class="hidden fade-in">
            <div id="result-capture-area">
                <div id="r-icon" style="font-size: 4rem;">🎁</div>
                <h2 id="r-title" style="color:var(--primary); margin-top:10px;">결과 제목</h2>
                <div class="bible-card">
                    <div class="bible-text" id="r-verse">말씀</div>
                    <div id="r-ref" style="text-align:right; font-size:0.8rem; color:#888; margin-top:5px;">참조</div>
                </div>
                <div id="r-desc" style="text-align:left; font-size:0.95rem; line-height:1.6; background:#f8f9fa; padding:15px; border-radius:10px;">설명</div>
            </div>
            <button class="btn btn-primary" onclick="shareResult()">결과 외부 앱으로 공유하기 📤</button>
            <button class="btn" style="background:#eee; color:var(--text);" onclick="downloadImage()">갤러리에 이미지 저장 📸</button>
            <button class="btn" style="background:#ddd;" onclick="location.reload()">다시 하기</button>
        </section>
    </div>

    <script>
        const qData = [
            { t: "복음은 단순히 지식이 아니라 내 삶을 변화시키는 강력한 힘이라고 믿는다.", type: "Ro", cat: "pos" },
            { t: "나쁜 습관을 고치려 해도 자꾸 제자리걸음인 내 모습에 실망할 때가 많다.", type: "Ro", cat: "neg" },
            { t: "잘못했을 때 자책하기보다 내가 하나님보다 더 의지한 우상이 무엇인지 찾아보려 한다.", type: "Ro", cat: "neu" },
            { t: "부족한 점이 많아도 내 안에 계신 예수님 때문에 나는 가치 있다고 느낀다.", type: "Co", cat: "pos" },
            { t: "실수나 부족한 점이 들킬까 봐 교회에서도 늘 괜찮은 척 연기하게 된다.", type: "Co", cat: "neg" },
            { t: "친구를 대할 때 외모나 성적보다 그 내면의 보배를 보려고 노력한다.", type: "Co", cat: "neu" },
            { t: "사랑받으려 애쓰기보다 이미 받은 사랑에 감사하며 자유롭게 예배드리는 편이다.", type: "Ga", cat: "pos" },
            { t: "남들의 기대를 저버리는 것이 두려워 억지로 종교 활동을 하는 기분이 든다.", type: "Ga", cat: "neg" },
            { t: "봉사나 착한 일을 할 때 내 동기가 인정 때문인지 사랑 때문인지 점검한다.", type: "Ga", cat: "neu" },
            { t: "세상 기준이 아니라 하나님이 나를 위해 특별한 계획을 세우셨음을 확신한다.", type: "Ep", cat: "pos" },
            { t: "내가 왜 공부하는지 삶의 목적을 잘 몰라 공허함을 느낄 때가 있다.", type: "Ep", cat: "neg" },
            { t: "학교생활의 소소한 일들도 하나님의 큰 계획 속에 있다고 생각한다.", type: "Ep", cat: "neu" },
            { t: "힘든 일이 생겨도 하나님이 선하게 인도하실 것을 믿으며 기뻐하려 노력한다.", type: "Ph", cat: "pos" },
            { t: "성적이 떨어지거나 상황이 나빠지면 마음의 평안이 순식간에 사라진다.", type: "Ph", cat: "neg" },
            { t: "지금의 스트레스가 나를 성장시키는 과정이라 믿고 차분하게 견뎌보려 한다.", type: "Ph", cat: "neu" }
        ];

        const rData = {
            "Ro": { title: "복음의 능력형 (로마서)", icon: "📖", tieTxt: "죄를 이기는 실제적인 복음의 능력", desc: "스스로 의로워지려는 노력을 멈추고 당신을 자녀 삼으신 하나님을 아빠로 신뢰하십시오. 복음은 관념이 아니라 삶을 변화시키는 실제적인 능력입니다.", verse: "내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라", ref: "로마서 1:16" },
            "Co": { title: "약함의 신비형 (고린도서)", icon: "🤝", tieTxt: "나의 부족함 속에 머무는 은혜의 신비", desc: "깨지기 쉬운 질그릇 같은 당신의 약함은 실패가 아닙니다. 그 속에 담긴 보배이신 예수님이 당신의 진짜 가치임을 기억하십시오.", verse: "우리가 이 보배를 질그릇에 가졌으니 이는 심히 큰 능력은 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라", ref: "고린도전서 4:7" },
            "Ga": { title: "은혜의 자유형 (갈라디아서)", icon: "🕊️", tieTxt: "의무가 아닌 사랑에서 우러나는 참된 자유", desc: "하나님께 인정받으려는 율법의 멍에를 벗어 던지십시오. 신앙은 순종해야 사랑받는 것이 아니라 이미 사랑받기에 순종하는 것입니다.", verse: "그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니 그러므로 굳건하게 서서 다시는 종의 멍에를 메지 말라", ref: "갈라디아서 5:1" },
            "Ep": { title: "우주적 정체성형 (에베소서)", icon: "🌌", tieTxt: "하나님의 계획 속에 있는 나의 존엄한 가치", desc: "당신은 우연이 아닌 창세 전부터 계획된 하나님의 걸작품입니다. 세상의 기준이 아닌 그리스도 안에서의 신분을 당신의 정체성으로 삼으십시오.", verse: "우리는 그가 만드신 바니라 그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니", ref: "에베소서 2:10" },
            "Ph": { title: "자족의 기쁨형 (빌립보서)", icon: "☀️", tieTxt: "환경을 뛰어넘어 누리는 정복할 수 없는 기쁨", desc: "지금의 고난은 실패가 아닌 복음의 전진을 위한 과정입니다. 어떤 형편에서도 자족할 수 있는 비결은 당신을 사랑하시는 그리스도 한 분으로 충분해지는 것입니다.", verse: "주 안에서 항상 기뻐하라 내가 다시 말하노니 기뻐하라", ref: "빌립보서 4:4" }
        };

        let step = 0;
        let scores = { Ro:0, Co:0, Ga:0, Ep:0, Ph:0 };

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startTest() {
            shuffleArray(qData);
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            nextQ();
        }

        function nextQ() {
            if (step >= qData.length) { calculateResult(); return; }
            document.getElementById('bar').style.width = `${(step / qData.length) * 100}%`;
            document.getElementById('q-num').innerText = step + 1;
            document.getElementById('q-text').innerText = qData[step].t;
            const area = document.getElementById('btn-area');
            area.innerHTML = '';
            
            [{t:"매우 그렇다", v:3}, {t:"그렇다", v:2}, {t:"아니다", v:0}].forEach(opt => {
                const b = document.createElement('button');
                b.className = 'btn btn-option';
                b.innerText = opt.t;
                b.onclick = () => {
                    let val = opt.v;
                    if (qData[step].cat === 'neu') val = Math.round(val * 0.7);
                    scores[qData[step].type] += val;
                    step++;
                    nextQ();
                };
                area.appendChild(b);
            });
        }

        function calculateResult() {
            const max = Math.max(...Object.values(scores));
            const winners = Object.keys(scores).filter(k => scores[k] === max);
            if (winners.length >= 2) {
                showTiebreaker(winners);
            } else {
                renderFinal(winners[0]);
            }
        }

        function showTiebreaker(winners) {
            document.getElementById('screen-quiz').classList.add('hidden');
            const screen = document.getElementById('screen-tiebreaker');
            screen.classList.remove('hidden');
            const area = document.getElementById('tie-options');
            area.innerHTML = '';
            winners.forEach(type => {
                const b = document.createElement('button');
                b.className = 'btn btn-option';
                b.innerText = rData[type].tieTxt;
                b.onclick = () => { screen.classList.add('hidden'); renderFinal(type); };
                area.appendChild(b);
            });
        }

        function renderFinal(type) {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            const res = rData[type];
            document.getElementById('r-icon').innerText = res.icon;
            document.getElementById('r-title').innerText = res.title;
            document.getElementById('r-verse').innerText = `"${res.verse}"`;
            document.getElementById('r-ref').innerText = res.ref;
            document.getElementById('r-desc').innerText = res.desc;
        }

        function downloadImage() {
            const area = document.getElementById('result-capture-area');
            area.classList.add('for-capture');
            html2canvas(area, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'PCI_Result.png';
                link.href = canvas.toDataURL();
                link.click();
                area.classList.remove('for-capture');
            });
        }

        async function shareResult() {
            const area = document.getElementById('result-capture-area');
            const canvas = await html2canvas(area, { scale: 2 });
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'pci_result.png', { type: 'image/png' });
                const shareData = {
                    title: '바울 서신 유형 테스트 결과',
                    text: `저의 바울 서신 유형은 [${document.getElementById('r-title').innerText}]입니다.`,
                    files: [file],
                };
                if (navigator.canShare && navigator.canShare(shareData)) {
                    try { await navigator.share(shareData); } catch (e) { console.log('공유 실패', e); }
                } else {
                    alert('이 브라우저에서는 공유 기능을 지원하지 않습니다. 크롬이나 사파리를 사용해 주세요.');
                }
            }, 'image/png');
        }
    </script>
</body>
</html>
