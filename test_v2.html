<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 바울 서신 유형 찾기</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* === ✨ 모바일 핵심 최적화 (여기부터) ✨ === */
        * {
            box-sizing: border-box;
            /* iOS에서 터치 시 회색 박스 생기는 것 방지 */
            -webkit-tap-highlight-color: transparent;
            /* 터치 반응 속도 향상 (더블탭 줌 딜레이 제거) */
            touch-action: manipulation;
        }
        body {
            /* 빠른 터치 시 텍스트 선택되는 것 방지 */
            user-select: none;
            -webkit-user-select: none;
            /* ... 기존 스타일 ... */
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
        }
        /* === 모바일 핵심 최적화 (여기까지) === */

        :root {
            --primary: #4A6FA5;
            --accent: #FF9F43;
            --bg: #F3F4F6;
            --white: #FFFFFF;
            --text: #333333;
            --gray: #666666;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: height 0.3s;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 { color: var(--primary); font-size: 1.6rem; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        h2 { font-size: 1.3rem; margin-bottom: 1.5rem; font-weight: 700; color: #2c3e50; }
        p.sub { font-size: 1rem; color: var(--gray); line-height: 1.6; margin-bottom: 2rem; word-break: keep-all; }
        
        /* 버튼 스타일 강화 */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease-in-out, background-color 0.2s; /* 반응 속도 더 빠르게 */
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        /* 터치했을 때 즉각적인 눌림 효과 */
        .btn:active { transform: scale(0.96) !important; }

        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3); }
        
        .btn-option { 
            background: #F8F9FA; 
            border: 2px solid #E9ECEF; 
            color: #495057; 
            margin-bottom: 12px;
            text-align: left;
            padding-left: 20px;
        }
        /* 모바일에서는 hover 효과 제거 (터치 후 남아있는 문제 해결) */
        @media (hover: hover) {
            .btn-option:hover { border-color: var(--primary); background: #EBF2FF; color: var(--primary); }
        }
        .btn-option:active { border-color: var(--primary); background: #EBF2FF; color: var(--primary); }


        .progress-area { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: #eee; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }

        .result-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 2s infinite; }
        .tag { display: inline-block; background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 10px; }
        .desc-box { background: #F8F9FA; padding: 20px; border-radius: 16px; text-align: left; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; border: 1px solid #eee; }
        .bible-card { background-color: #FFF8E1; border-left: 4px solid var(--accent); padding: 15px; text-align: left; margin-bottom: 20px; border-radius: 0 10px 10px 0; }
        .bible-text { font-style: italic; font-weight: 600; color: #555; font-size: 0.95rem; }
        .bible-ref { display: block; margin-top: 8px; font-size: 0.85rem; color: #888; text-align: right; }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }

        /* 타이브레이커 버튼 글자 크기 조정 */
        #tie-options .btn {
            font-size: 0.95rem;     /* 기존 1.1rem에서 0.95rem으로 축소 */
            padding: 14px 18px;     /* 글자 크기에 맞춰 패딩 살짝 조정 */
            line-height: 1.4;       /* 줄간격 최적화로 가독성 향상 */
            word-break: keep-all;   /* 단어 단위로 줄바꿈 방지 */
            letter-spacing: -0.5px; /* 자간을 좁혀 더 많은 텍스트 수용 */
        }

        /* 텍스트가 유독 길 경우를 대비한 미세 조정 */
        #tie-options .btn-option {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        #result-capture-area.for-capture {
            background: #ffffff !important;
            padding: 60px 40px !important; /* 이미지에 충분한 상하좌우 여백 부여 */
            border-radius: 40px !important; /* 이미지 모서리를 크게 라운딩 */
            box-shadow: none !important;    /* 이미지 자체에는 그림자가 없는 게 깔끔합니다 */
            width: 450px !important;        /* 이미지의 가로 폭을 고정하여 레이아웃 최적화 */
        }
    </style>
</head>
<body>
    <div class="card">
        <section id="screen-start" class="fade-in">
            <div style="font-size: 4rem; margin-bottom: 20px;">🏛️</div>
            <h1>바울의 편지 찾기</h1>
            <p class="sub">수많은 교회에 편지를 썼던 바울,<br>지금 나에게 편지를 보낸다면<br>어떤 내용이 담겨 있을까요?</p>
            <button class="btn btn-primary" onclick="startTest()">내 유형 알아보기</button>
            <div style="margin-top:20px; font-size:0.8rem; color:#aaa;">로고스 고등부</div>
        </section>

        <section id="screen-quiz" class="hidden">
            <div class="progress-area"><div class="progress-bar" id="bar"></div></div>
            <div style="margin-bottom: 30px; color: var(--primary); font-weight:bold;">Q<span id="q-num">1</span></div>
            <h2 id="q-text" style="min-height: 60px;">질문 내용</h2>
            <div id="btn-area"></div>
        </section>

        <section id="screen-tiebreaker" class="hidden fade-in">
            <div style="font-size: 3rem; margin-bottom: 15px;">⚖️</div>
            <h2 style="color:#e67e22;">마지막 선택!</h2>
            <p id="tie-desc" style="margin-bottom:20px; color:#666;">지금 당신에게 더 필요한 가치는?</p>
            <div id="tie-options"></div>
        </section>

        <section id="screen-retry" class="hidden fade-in">
            <div style="font-size: 4rem; margin-bottom: 15px;">🧐</div>
            <h2 style="color:#4A6FA5;">분석이 어려워요!</h2>
            <p style="margin-bottom:20px; color:#666; line-height: 1.6;">
                학생분의 신앙 색깔이 너무 다채롭네요!<br>
                하나로 정의하기가 조금 어렵습니다.<br>
                조금 더 솔직하게 다시 한번 답변해 볼까요?
            </p>
            <button class="btn btn-primary" onclick="location.reload()">처음으로 이동하기</button>
        </section>

        <section id="screen-loading" class="hidden">
            <div style="font-size: 3rem;">📩</div>
            <h2>결과 분석 중...</h2>
            <p class="sub">바울이 펜을 들고<br>당신을 위한 서신을 고르고 있습니다.</p>
        </section>

        <section id="screen-result" class="hidden fade-in">
            <div id="result-capture-area">
                <div id="r-icon" style="font-size: 4rem; margin-bottom:10px;">🎁</div>
                <h2 id="r-title" style="color:var(--primary);">결과 제목</h2>
                <div class="bible-card">
                    <div class="bible-text" id="r-verse">말씀</div>
                    <div id="r-ref" style="text-align:right; font-size:0.8rem; color:#888; margin-top:5px;">참조</div>
                </div>
                <div id="r-desc" style="text-align:left; font-size:0.95rem; line-height:1.6; background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:20px;">설명</div>
                <div style="margin-top:10px; font-size:0.7rem; color:#ccc;">LOGOS CHURCH HIGH SCHOOL</div>
            </div>

            <button class="btn btn-primary" onclick="downloadImage()">결과 이미지 저장하기 📸</button>
            <button class="btn" style="background:#eee; color:#333;" onclick="location.reload()">다시 하기</button>
        </section>
    </div>

    <script>
        const qData = [
    // 파트 1: 긍정적 고백 (복음적 정체성 및 지향)
    { t: "복음은 단순히 아는 지식이 아니라 내 삶을 실제로 변화시키는 강력한 힘이라고 믿는다.", type: "Ro" }, //
    { t: "내가 남들보다 부족한 점이 많아도 내 안에 계신 예수님 때문에 나는 충분히 가치 있다고 느낀다.", type: "Co" }, //
    { t: "하나님께 더 사랑받으려 애쓰기보다 이미 받은 사랑에 감사하며 자유롭게 예배드리는 편이다.", type: "Ga" }, //
    { t: "세상의 기준이 아니라 창세 전부터 나를 계획하신 하나님의 소중한 작품임을 확신한다.", type: "Ep" }, //
    { t: "지금 당장 힘든 일이 생겨도 결국 하나님이 선한 일을 이루실 것을 믿으며 기뻐할 수 있다.", type: "Ph" }, //

    // 파트 2: 부정적 고민 (내면의 우상 및 영적 결핍)
    { t: "나쁜 습관을 고치려고 아무리 노력해도 자꾸만 제자리걸음인 내 모습에 크게 실망할 때가 많다.", type: "Ro" }, //
    { t: "실수하거나 부족한 모습이 남들에게 들킬까 봐 교회에서도 늘 괜찮은 척 연기하게 된다.", type: "Co" }, //
    { t: "부모님이나 선생님의 기대를 저버리는 것이 두려워 억지로 종교 활동에 참여하는 기분이 든다.", type: "Ga" }, //
    { t: "내가 왜 살아야 하는지 하나님이 나를 왜 만드셨는지 삶의 목적을 몰라 공허함을 느낀다.", type: "Ep" }, //
    { t: "상황이 조금만 나빠지거나 성적이 떨어지면 마음속의 평안과 기쁨이 순식간에 사라진다.", type: "Ph" } //
];

const rData = {
    "Ro": { 
        title: "복음의 능력형 (로마서)", 
        icon: "📖", 
        tieTxt: "죄를 이기는 실제적인 복음의 능력", 
        desc: "스스로 의로워지려는 노력을 멈추고 당신을 자녀 삼으신 하나님을 아빠로 신뢰하십시오. 복음은 관념이 아니라 삶을 변화시키는 실제적인 능력입니다.", 
        verse: "내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라", 
        ref: "로마서 1:16" //
    },
    "Co": { 
        title: "약함의 신비형 (고린도서)", 
        icon: "🤝", 
        tieTxt: "나의 부족함 속에 머무는 은혜의 신비", 
        desc: "깨지기 쉬운 질그릇 같은 당신의 약함은 실패가 아닙니다. 그 속에 담긴 보배이신 예수님이 당신의 진짜 가치임을 기억하십시오.", 
        verse: "우리가 이 보배를 질그릇에 가졌으니 이는 심히 큰 능력은 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라", 
        ref: "고린도전서 4:7" //
    },
    "Ga": { 
        title: "은혜의 자유형 (갈라디아서)", 
        icon: "🕊️", 
        tieTxt: "의무가 아닌 사랑에서 우러나는 참된 자유", 
        desc: "하나님께 인정받으려는 율법의 멍에를 벗어 던지십시오. 신앙은 순종해야 사랑받는 것이 아니라 이미 사랑받기에 순종하는 것입니다.", 
        verse: "그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니 그러므로 굳건하게 서서 다시는 종의 멍에를 메지 말라", 
        ref: "갈라디아서 5:1" //
    },
    "Ep": { 
        title: "우주적 정체성형 (에베소서)", 
        icon: "🌌", 
        tieTxt: "하나님의 계획 속에 있는 나의 존엄한 가치", 
        desc: "당신은 우연이 아닌 창세 전부터 계획된 하나님의 걸작품입니다. 세상의 기준이 아닌 그리스도 안에서의 신분을 당신의 정체성으로 삼으십시오.", 
        verse: "우리는 그가 만드신 바니라 그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니", 
        ref: "에베소서 2:10" //
    },
    "Ph": { 
        title: "자족의 기쁨형 (빌립보서)", 
        icon: "☀️", 
        tieTxt: "환경을 뛰어넘어 누리는 정복할 수 없는 기쁨", 
        desc: "지금의 고난은 실패가 아닌 복음의 전진을 위한 과정입니다. 어떤 형편에서도 자족할 수 있는 비결은 당신을 사랑하시는 그리스도 한 분으로 충분해지는 것입니다.", 
        verse: "주 안에서 항상 기뻐하라 내가 다시 말하노니 기뻐하라", 
        ref: "빌립보서 4:4" //
    }
};

        let step = 0;
        let scores = { Ro:0, Co:0, Ga:0, Ep:0, Ph:0 };

        function startTest() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            nextQ();
        }

        function nextQ() {
            if (step >= qData.length) { showResult(); return; }
            document.getElementById('bar').style.width = `${(step / qData.length) * 100}%`;
            document.getElementById('q-num').innerText = step + 1;
            document.getElementById('q-text').innerText = qData[step].t;
            const area = document.getElementById('btn-area');
            area.innerHTML = '';
            [{t:"매우 그렇다", v:3}, {t:"그렇다", v:2}, {t:"아니다", v:0}].forEach(opt => {
                const b = document.createElement('button');
                b.className = 'btn btn-option';
                b.innerText = opt.t;
                b.onclick = () => { scores[qData[step].type] += opt.v; step++; nextQ(); };
                area.appendChild(b);
            });
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-loading').classList.remove('hidden');

            setTimeout(() => {
                const max = Math.max(...Object.values(scores));
                const winners = Object.keys(scores).filter(k => scores[k] === max);

                document.getElementById('screen-loading').classList.add('hidden');

                if (winners.length >= 4) {
                    // 동점 4개 이상: 리트라이 화면
                    document.getElementById('screen-retry').classList.remove('hidden');
                } else if (winners.length >= 2) {
                    // 동점 2~3개: 타이브레이커 발동
                    startTiebreaker(winners);
                } else {
                    renderFinal(winners[0]);
                }
            }, 1500);
        }

        function startTiebreaker(winners) {
            const tieScreen = document.getElementById('screen-tiebreaker');
            tieScreen.classList.remove('hidden');
            
            // 3개일 경우 안내 문구 변경
            if(winners.length === 3) {
                document.getElementById('tie-desc').innerText = "세 가지 가치가 박빙이네요!\n가장 마음이 가는 하나를 골라주세요.";
            }

            const area = document.getElementById('tie-options');
            area.innerHTML = '';
            winners.forEach(type => {
                const b = document.createElement('button');
                b.className = 'btn btn-option';
                b.style.marginBottom = "10px";
                b.innerText = rData[type].tieTxt;
                b.onclick = () => {
                    tieScreen.classList.add('hidden');
                    renderFinal(type);
                };
                area.appendChild(b);
            });
        }

        function renderFinal(type) {
            document.getElementById('screen-loading').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            const res = rData[type];
            document.getElementById('r-icon').innerText = res.icon;
            document.getElementById('r-title').innerText = res.title;
            document.getElementById('r-verse').innerText = `"${res.verse}"`;
            document.getElementById('r-ref').innerText = res.ref;
            document.getElementById('r-desc').innerText = res.desc;
        }
        function downloadImage() {
            const captureElement = document.getElementById('result-capture-area');
            
            // 캡처 중임을 알리는 UI 변경 (선택 사항)
            const btn = document.querySelector('.btn-primary');

            captureElement.classList.add('for-capture');

            const originalText = btn.innerText;
            btn.innerText = "이미지 생성 중...";
            btn.disabled = true;

            html2canvas(captureElement, {
                scale: 2, // 고해상도로 캡처 (선명하게)
                backgroundColor: null, // 배경색 지정
                logging: false, // 로그 끄기
                useCORS: true // 외부 이미지 사용 시 필요
            }).then(canvas => {
                // 캔버스를 이미지 URL로 변환
                const image = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
                
                // 가상의 다운로드 링크 생성 및 클릭
                const link = document.createElement('a');
                link.download = '나의_바울서신_유형.png'; // 저장될 파일명
                link.href = image;
                link.click();

                // UI 원상복구
                captureElement.classList.remove('for-capture');
                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                captureElement.classList.remove('for-capture');
                alert("이미지 저장 중 오류가 발생했습니다.");
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>

</html>
