<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 바울 서신 유형 찾기</title>
    <style>
        /* === ✨ 모바일 핵심 최적화 (여기부터) ✨ === */
        * {
            box-sizing: border-box;
            /* iOS에서 터치 시 회색 박스 생기는 것 방지 */
            -webkit-tap-highlight-color: transparent;
            /* 터치 반응 속도 향상 (더블탭 줌 딜레이 제거) */
            touch-action: manipulation;
        }
        body {
            /* 빠른 터치 시 텍스트 선택되는 것 방지 */
            user-select: none;
            -webkit-user-select: none;
            /* ... 기존 스타일 ... */
            font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
        }
        /* === 모바일 핵심 최적화 (여기까지) === */

        :root {
            --primary: #4A6FA5;
            --accent: #FF9F43;
            --bg: #F3F4F6;
            --white: #FFFFFF;
            --text: #333333;
            --gray: #666666;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: height 0.3s;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 { color: var(--primary); font-size: 1.6rem; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
        h2 { font-size: 1.3rem; margin-bottom: 1.5rem; font-weight: 700; color: #2c3e50; }
        p.sub { font-size: 1rem; color: var(--gray); line-height: 1.6; margin-bottom: 2rem; word-break: keep-all; }
        
        /* 버튼 스타일 강화 */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease-in-out, background-color 0.2s; /* 반응 속도 더 빠르게 */
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        /* 터치했을 때 즉각적인 눌림 효과 */
        .btn:active { transform: scale(0.96) !important; }

        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3); }
        
        .btn-option { 
            background: #F8F9FA; 
            border: 2px solid #E9ECEF; 
            color: #495057; 
            margin-bottom: 12px;
            text-align: left;
            padding-left: 20px;
        }
        /* 모바일에서는 hover 효과 제거 (터치 후 남아있는 문제 해결) */
        @media (hover: hover) {
            .btn-option:hover { border-color: var(--primary); background: #EBF2FF; color: var(--primary); }
        }
        .btn-option:active { border-color: var(--primary); background: #EBF2FF; color: var(--primary); }


        .progress-area { position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: #eee; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }

        .result-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 2s infinite; }
        .tag { display: inline-block; background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 10px; }
        .desc-box { background: #F8F9FA; padding: 20px; border-radius: 16px; text-align: left; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; border: 1px solid #eee; }
        .bible-card { background-color: #FFF8E1; border-left: 4px solid var(--accent); padding: 15px; text-align: left; margin-bottom: 20px; border-radius: 0 10px 10px 0; }
        .bible-text { font-style: italic; font-weight: 600; color: #555; font-size: 0.95rem; }
        .bible-ref { display: block; margin-top: 8px; font-size: 0.85rem; color: #888; text-align: right; }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }

    </style>
</head>
<body>
    <div class="card">
        <section id="screen-start" class="fade-in">
            <div style="font-size: 4rem; margin-bottom: 20px;">🏛️</div>
            <h1>바울의 편지 찾기</h1>
            <p class="sub">수많은 교회에 편지를 썼던 바울,<br>지금 나에게 편지를 보낸다면<br>어떤 내용이 담겨 있을까요?</p>
            <button class="btn btn-primary" onclick="startTest()">내 유형 알아보기</button>
            <div style="margin-top:20px; font-size:0.8rem; color:#aaa;">Designed by Gemini</div>
        </section>

        <section id="screen-quiz" class="hidden">
            <div class="progress-area"><div class="progress-bar" id="bar"></div></div>
            <div style="margin-bottom: 30px; color: var(--primary); font-weight:bold;">Q<span id="q-num">1</span></div>
            <h2 id="q-text" style="min-height: 60px;">질문 내용</h2>
            <div id="btn-area"></div>
        </section>

        <section id="screen-loading" class="hidden">
            <div style="font-size: 3rem;">📩</div>
            <h2>결과 분석 중...</h2>
            <p class="sub">바울이 펜을 들고<br>당신을 위한 서신을 고르고 있습니다.</p>
        </section>

        <section id="screen-result" class="hidden fade-in">
            <div class="result-icon" id="r-icon">🎁</div>
            <span class="tag">당신의 영적 성향</span>
            <h2 id="r-title" style="color:var(--primary); margin-bottom:10px;">결과 제목</h2>
            <div class="bible-card">
                <div class="bible-text" id="r-verse">"말씀 내용이 들어갑니다"</div>
                <span class="bible-ref" id="r-ref">성경 구절</span>
            </div>
            <div class="desc-box" id="r-desc">결과 설명이 들어갑니다.</div>
            <button class="btn btn-primary" onclick="copyResult()">결과 텍스트 복사하기</button>
            <button class="btn" style="background:#333; color:white;" onclick="location.reload()">다시 하기</button>
        </section>
    </div>

    <script>
        const qData = [
            { t: "지금 신앙생활에서 '감정적 체험'보다 '논리적 이해'가 더 중요하다고 느낀다.", type: "Ro" },
            { t: "현재 공동체 내의 갈등이나 복잡한 인간관계로 인해 고민이 있다.", type: "Co" },
            { t: "종교적인 의무감이나 율법적인 신앙생활에서 벗어나 '자유'롭고 싶다.", type: "Ga" },
            { t: "눈에 보이는 현실 너머의 영적 세계와 나의 부르심에 관심이 많다.", type: "Ep" },
            { t: "지금 상황이 지치고 힘들어서 따뜻한 위로와 미래의 소망이 절실하다.", type: "Ph" },
            { t: "기독교의 핵심 교리(죄, 구원 등)를 튼튼하게 다지고 싶다.", type: "Ro" },
            { t: "나의 은사(재능)를 공동체를 위해 어떻게 써야 할지 궁금하다.", type: "Co" },
            { t: "남들의 시선을 의식하는 신앙에서 벗어나 본질에 집중하고 싶다.", type: "Ga" },
            { t: "교회의 진정한 의미와 거대한 영적 비밀을 깨닫고 싶다.", type: "Ep" },
            { t: "환경에 흔들리지 않고 항상 기뻐할 수 있는 마음을 갖고 싶다.", type: "Ph" }
        ];
        const rData = {
            "Ro": { title: "진리 탐구형 (로마서)", icon: "📖", desc: "당신은 신앙의 기초와 논리를 중요하게 생각합니다. 흔들리지 않는 교리의 토대 위에 설 때 평안을 얻습니다.", verse: "그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라", ref: "로마서 10:17" },
            "Co": { title: "관계 회복형 (고린도전후서)", icon: "🤝", desc: "당신은 사람과 공동체를 깊이 생각합니다. 갈등 속에서도 사랑으로 하나 되는 지혜를 구하는 평화의 사도입니다.", verse: "사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며...", ref: "고린도전서 13:4" },
            "Ga": { title: "자유 추구형 (갈라디아서)", icon: "🕊️", desc: "형식보다는 본질을 추구하는 당신! 사람의 인정이 아닌 하나님 안에서의 참된 자유를 갈망하고 있습니다.", verse: "그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니...", ref: "갈라디아서 5:1" },
            "Ep": { title: "영적 신비형 (에베소서)", icon: "🌌", desc: "당신은 더 깊은 차원의 영적 세계를 갈망합니다. 교회의 영광과 당신을 향한 부르심을 발견하기를 원합니다.", verse: "너희 마음의 눈을 밝히사 그의 부르심의 소망이 무엇이며...", ref: "에베소서 1:18" },
            "Ph": { title: "기쁨과 소망형 (빌립보서)", icon: "☀️", desc: "위로와 소망이 필요한 당신. 감옥에서도 찬양했던 바울처럼, 환경을 뛰어넘는 기쁨을 찾게 될 것입니다.", verse: "주 안에서 항상 기뻐하라 내가 다시 말하노니 기뻐하라", ref: "빌립보서 4:4" }
        };

        let step = 0;
        let scores = { Ro:0, Co:0, Ga:0, Ep:0, Ph:0 };

        function startTest() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            nextQ();
        }

        function nextQ() {
            const bar = document.getElementById('bar');
            const qNum = document.getElementById('q-num');
            const qText = document.getElementById('q-text');
            const btnArea = document.getElementById('btn-area');
            bar.style.width = `${(step / qData.length) * 100}%`;
            if (step >= qData.length) { showResult(); return; }
            qNum.innerText = step + 1;
            qText.innerText = qData[step].t;
            btnArea.innerHTML = '';
            const opts = [ { txt: "매우 그렇다", val: 3 }, { txt: "그렇다", val: 2 }, { txt: "아니다", val: 0 } ];
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-option';
                btn.innerText = opt.txt;
                // 모바일 터치 이벤트 명시적 추가 (필수는 아니지만 안정성 확보)
                btn.addEventListener('touchstart', function() {}, {passive: true}); 
                btn.onclick = () => { scores[qData[step].type] += opt.val; step++; nextQ(); };
                btnArea.appendChild(btn);
            });
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-loading').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('screen-loading').classList.add('hidden');
                document.getElementById('screen-result').classList.remove('hidden');
                let max = -1; let type = "Ro";
                for (let k in scores) { if (scores[k] > max) { max = scores[k]; type = k; } }
                const res = rData[type];
                document.getElementById('r-icon').innerText = res.icon;
                document.getElementById('r-title').innerText = res.title;
                document.getElementById('r-desc').innerHTML = res.desc;
                document.getElementById('r-verse').innerText = `"${res.verse}"`;
                document.getElementById('r-ref').innerText = res.ref;
            }, 1500);
        }

        function copyResult() {
            const title = document.getElementById('r-title').innerText;
            const verse = document.getElementById('r-verse').innerText;
            const text = `[바울 서신 유형 테스트]\n나의 결과: ${title}\n\n${verse}`;
            navigator.clipboard.writeText(text).then(() => { alert("결과가 복사되었습니다!"); });
        }
    </script>
</body>
</html>
