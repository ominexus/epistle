<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프로젝트 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .card-active:active {
            transform: scale(0.98);
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen pb-safe">

    <!-- 메인 컨텐츠 -->
    <main class="w-full px-4 py-8 max-w-lg mx-auto">
        
        <!-- 심플 헤더 영역 -->
        <div class="flex items-end justify-between mb-6">
            <h1 class="text-2xl font-bold text-gray-900">메인 대시보드</h1>
            <span id="current-date" class="text-sm text-gray-500 font-medium"></span>
        </div>
        
        <!-- 상태 메시지 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-6 flex items-start gap-3">
            <i data-lucide="info" class="w-5 h-5 text-blue-500 mt-0.5 flex-shrink-0"></i>
            <div>
                <h2 class="text-sm font-bold text-gray-800">환영합니다</h2>
                <p class="text-xs text-gray-500 mt-1">아래 목록에서 원하는 학습 도구를 선택하세요.</p>
            </div>
        </div>

        <h2 class="text-sm font-bold text-gray-500 mb-3 px-1">학습 자료 및 도구</h2>

        <!-- 모바일 최적화된 리스트형 카드 그리드 -->
        <div class="grid grid-cols-1 gap-4">
            
            <!-- Guide Link: 서신 가이드 앱 -->
            <a href="guide.html" class="block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden card-active transition-colors">
                <div class="flex items-center p-4">
                    <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="smartphone" class="w-6 h-6 text-blue-600"></i>
                    </div>
                    <div class="ml-4 flex-grow">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-gray-900">서신 가이드 앱</h3>
                            <span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-bold">App</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 ml-2"></i>
                </div>
            </a>

            <!-- Galatians Link: 갈라디아서 묵상 가이드 파일 -->
            <a href="galatians.html" class="block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden card-active transition-colors">
                <div class="flex items-center p-4">
                    <div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="book-open" class="w-6 h-6 text-indigo-600"></i>
                    </div>
                    <div class="ml-4 flex-grow">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-gray-900">갈라디아서 묵상 가이드</h3>
                            <span class="bg-indigo-100 text-indigo-700 text-[10px] px-2 py-0.5 rounded-full font-bold">PDF/Doc</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 ml-2"></i>
                </div>
            </a>

            <!-- Test V1 Link: 교사용 질문지 -->
            <a href="test_v1.html" class="block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden card-active transition-colors">
                <div class="flex items-center p-4">
                    <div class="w-12 h-12 rounded-full bg-emerald-50 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="presentation" class="w-6 h-6 text-emerald-600"></i>
                    </div>
                    <div class="ml-4 flex-grow">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-gray-900">교사용 질문지</h3>
                            <span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Teacher</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 ml-2"></i>
                </div>
            </a>

            <!-- Test V2 Link: 학생용 질문지 -->
            <a href="test_v2.html" class="block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden card-active transition-colors">
                <div class="flex items-center p-4">
                    <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center flex-shrink-0">
                        <i data-lucide="edit-3" class="w-6 h-6 text-amber-600"></i>
                    </div>
                    <div class="ml-4 flex-grow">
                        <div class="flex justify-between items-center">
                            <h3 class="text-base font-bold text-gray-900">학생용 질문지</h3>
                            <span class="bg-amber-100 text-amber-700 text-[10px] px-2 py-0.5 rounded-full font-bold">Student</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 ml-2"></i>
                </div>
            </a>

        </div>

    </main>

    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

        // 날짜 설정
        const now = new Date();
        const dateOptions = { month: 'long', day: 'numeric', weekday: 'short' };
        document.getElementById('current-date').textContent = now.toLocaleDateString('ko-KR', dateOptions);
    </script>
</body>
</html>
